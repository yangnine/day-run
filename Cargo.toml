[package]
name = "day-run"
version = "0.1.0"
edition = "2024"

[dependencies]
csv ="1"
bytes = "1"
anyhow = "1"
dotenvy = "0.15"
rust-s3 = "0.37.2"
zip = "2"
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
serde = { version = "1.0.197", features = ["derive"] }
clap = { version = "=4.5.4", features = ["derive"] }
chrono = { version = "0.4.38", features = ["serde"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
